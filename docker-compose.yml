# Uruchomienie całości: docker compose up --build
#   aplikacja: http://localhost   API: http://localhost/api/v1   dokumentacja API: http://localhost/api/docs
#   samo API (bez src/ui): docker compose up --build api   → http://localhost:8000/api/v1/docs
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AED_DB: /data/aed.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - aed-data:/data
      - ./data/cache:/app/data/cache
    restart: unless-stopped
  ui:
    build: ./src/ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
volumes:
  aed-data:
